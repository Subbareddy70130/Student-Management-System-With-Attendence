<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Students{% endblock %} · Student Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="brand-mark">S</span>
      <span class="brand-name">Student Desk</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/" class="{{ 'active' if request.url.path == '/' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>All students</span>
      </a>
      <a href="/students/add" class="{{ 'active' if request.url.path == '/students/add' }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        <span>Add student</span>
      </a>
    </nav>
    <div class="sidebar-foot">Student management</div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>

<dialog id="confirm-dialog">
  <h3 id="confirm-title">Delete student?</h3>
  <p id="confirm-text">This can't be undone.</p>
  <div class="dialog-actions">
    <button type="button" class="btn btn-ghost" id="confirm-cancel">Keep student</button>
    <button type="button" class="btn btn-danger-solid" id="confirm-ok">Delete student</button>
  </div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
